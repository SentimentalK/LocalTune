server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml font/woff2 application/font-woff2;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Content-hashed build assets never change under the same URL.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Demo media and PWA icons never change under the same URL: cover names carry
  # a content hash (<slug>.<hash>.webp) and the icons only change with a
  # release. A year of immutable caching keeps Chinese clients off the origin;
  # /sw.js below stays revalidated so the app itself still updates.
  location /demo/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /icons/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The shell and the service worker must revalidate so a deploy is picked up.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    types {
      application/manifest+json webmanifest;
    }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location /.well-known/ {
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # The playlist resolver is retired: old /api/* endpoints must not fall
  # through to the SPA shell and answer 200.
  location /api/ {
    return 404;
  }

  # SPA: unknown paths serve the shell.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
