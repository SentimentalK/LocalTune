<!doctype html>
<html lang="zh-CN" data-theme="blue">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101921" />
    <meta name="color-scheme" content="dark" />
    <link rel="stylesheet" href="__CSS__" />
    <script>
      try {
        var theme = localStorage.getItem('localtune-theme');
        if (theme === 'burgundy' || theme === 'forest') document.documentElement.dataset.theme = theme;
        var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = bg || '#101921';
      } catch (error) {}
    </script>
    <title>LocalTune</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LocalTune" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="__JS__"></script>
  </body>
</html>
