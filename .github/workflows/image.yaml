name: Build & Publish Image

# Every push (any branch) builds, smoke-tests and publishes a multi-arch
# (amd64 + arm64, Linux only) image to GHCR, tagged sha-<short> and <branch>.
# Only main moves :latest.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build, Smoke-test & Publish
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/localtune" >> "$GITHUB_ENV"

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Smoke build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: localtune:ci
          cache-from: type=gha

      - name: Smoke test container
        run: |
          CONTAINER_ID=$(docker run -d -p 8080:8080 localtune:ci)
          trap "docker logs $CONTAINER_ID; docker rm -f $CONTAINER_ID" EXIT

          for i in $(seq 1 15); do
            curl -fs http://localhost:8080/healthz >/dev/null && break
            sleep 1
          done

          check() {
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080$1")
            echo "$1 -> $status"
            test "$status" = "200" || { echo "expected 200 for $1"; exit 1; }
          }
          check /healthz
          check /
          check /manifest.webmanifest
          check /sw.js

          header() {
            curl -sI "http://localhost:8080$1" | tr -d '\r' | grep -qi "$2"
          }
          header /sw.js 'cache-control:.*no-cache' || { echo "/sw.js must be no-cache"; exit 1; }
          header /manifest.webmanifest 'content-type: application/manifest+json' \
            || { echo "/manifest.webmanifest MIME type is wrong"; exit 1; }

          check /.well-known/microsoft-identity-association.json
          header /.well-known/microsoft-identity-association.json 'content-type: application/json' \
            || { echo ".well-known MIME type is wrong"; exit 1; }
          curl -s http://localhost:8080/.well-known/microsoft-identity-association.json \
            | grep -q '195e9ac7-6f9e-4a3c-bf09-42e0961c796a' \
            || { echo ".well-known body is wrong"; exit 1; }
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/.well-known/does-not-exist)
          test "$status" = "404" || { echo "unknown .well-known path must 404, got $status"; exit 1; }

          ASSET=$(curl -s http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -n 1)
          test -n "$ASSET" || { echo "no /assets/*.js referenced from /"; exit 1; }
          check "$ASSET"
          header "$ASSET" 'cache-control:.*immutable' || { echo "$ASSET must be immutable"; exit 1; }

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Multi-arch Image
        if: github.event_name != 'pull_request'
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve image tag
        id: tag
        if: github.event_name != 'pull_request'
        env:
          TAG_NAMES: ${{ steps.meta.outputs.tag-names }}
        run: |
          set -euo pipefail
          TAG=$(printf '%s\n' "$TAG_NAMES" | grep -m1 '^sha-[0-9a-f]\{7\}$' || true)
          if [ -z "$TAG" ]; then
            echo "no sha-<7 hex> tag among generated tags"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Print Published Image
        if: github.event_name != 'pull_request'
        run: |
          echo "Image digest: ${{ steps.docker_build.outputs.digest }}"
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}"

  build-resolver:
    name: Build, Smoke-test & Publish Resolver
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/localtune-resolver" >> "$GITHUB_ENV"

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Smoke build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.resolver
          platforms: linux/amd64
          load: true
          tags: localtune-resolver:ci
          cache-from: type=gha

      - name: Smoke test container
        run: |
          CONTAINER_ID=$(docker run -d -p 8787:8787 localtune-resolver:ci)
          trap "docker logs $CONTAINER_ID; docker rm -f $CONTAINER_ID" EXIT

          for i in $(seq 1 15); do
            curl -fs http://localhost:8787/api/healthz >/dev/null && break
            sleep 1
          done

          curl -fs http://localhost:8787/api/healthz >/dev/null || { echo "resolver did not become healthy"; exit 1; }
          test "$(curl -s http://localhost:8787/api/healthz)" = "ok" \
            || { echo "/api/healthz body must be exactly 'ok'"; exit 1; }

          check() {
            status=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8787$1")
            echo "$1 -> $status"
            test "$status" = "200" || { echo "expected 200 for $1"; exit 1; }
          }
          check /api/healthz
          check /healthz

          status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8787/api/resolve?url=https://example.com/x")
          echo "/api/resolve?url=https://example.com/x -> $status"
          test "$status" = "400" || { echo "expected 400 for a non-allowlisted playlist URL, got $status"; exit 1; }

          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8787/api/nope)
          echo "/api/nope -> $status"
          test "$status" = "404" || { echo "expected 404 for /api/nope, got $status"; exit 1; }

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Multi-arch localtune-resolver Image
        if: github.event_name != 'pull_request'
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.resolver
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve image tag
        id: tag
        if: github.event_name != 'pull_request'
        env:
          TAG_NAMES: ${{ steps.meta.outputs.tag-names }}
        run: |
          set -euo pipefail
          TAG=$(printf '%s\n' "$TAG_NAMES" | grep -m1 '^sha-[0-9a-f]\{7\}$' || true)
          if [ -z "$TAG" ]; then
            echo "no sha-<7 hex> tag among generated tags"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Print Published Image
        if: github.event_name != 'pull_request'
        run: |
          echo "Image digest: ${{ steps.docker_build.outputs.digest }}"
          echo "Tags:"
          echo "${{ steps.meta.outputs.tags }}"

  deploy:
    name: Write image tag back to k3s-homelab
    needs: [build-and-push, build-resolver]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check write-back token
        id: check
        env:
          K3S_HOMELAB_TOKEN: ${{ secrets.K3S_HOMELAB_TOKEN }}
        run: |
          if [ -z "$K3S_HOMELAB_TOKEN" ]; then
            echo "::notice::K3S_HOMELAB_TOKEN not set, skipping GitOps write-back"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out k3s-homelab
        if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: SentimentalK/k3s-homelab
          ref: master
          token: ${{ secrets.K3S_HOMELAB_TOKEN }}
          path: k3s

      - name: Bump image tag
        id: bump
        if: steps.check.outputs.ok == 'true'
        working-directory: k3s
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          RESOLVER_TAG: ${{ needs.build-resolver.outputs.image_tag }}
        run: |
          set -euo pipefail
          case "$IMAGE_TAG" in
            sha-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "unexpected image tag: '$IMAGE_TAG'"; exit 1 ;;
          esac
          if [ "$IMAGE_TAG" != "$RESOLVER_TAG" ]; then
            echo "image tags diverged: app='$IMAGE_TAG' resolver='$RESOLVER_TAG'"
            exit 1
          fi
          FILE=apps/localtune/kustomization.yaml
          COUNT=$(grep -c '^[[:space:]]*newTag:' "$FILE" || true)
          if [ "$COUNT" != "2" ]; then
            echo "expected exactly 2 newTag entries in $FILE, found $COUNT"
            exit 1
          fi
          CURRENT=$(sed -n 's/^[[:space:]]*newTag:[[:space:]]*//p' "$FILE" | sort -u)
          if [ "$CURRENT" = "$IMAGE_TAG" ]; then
            echo "::notice::k3s-homelab already at $IMAGE_TAG, nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i "s|^\([[:space:]]*newTag:\).*|\1 $IMAGE_TAG|" "$FILE"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff -- "$FILE"

      - name: Commit and push
        if: steps.check.outputs.ok == 'true' && steps.bump.outputs.changed == 'true'
        working-directory: k3s
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          git config user.name "localtune-ci"
          git config user.email "ci@users.noreply.github.com"
          git add apps/localtune/kustomization.yaml
          git commit -m "deploy(localtune): $IMAGE_TAG"
          git push origin master || { git pull --rebase && git push origin master; }
